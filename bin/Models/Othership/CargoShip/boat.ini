# Cargo Ship - generic bulk carrier (~170m Handysize)
# Model has length along X axis, needs 90deg yaw correction
# Real specs: 170m LOA, 28m beam, 10m draft, 15kn service / 16kn max
FileName="cargo_ship.glb"
ScaleFactor=1.338
YCorrection=15.7
AngleCorrection=90
Depth=10

# Ownship camera views (ship-local frame: +Z=fwd, +X=stbd, +Y=up)
# Model top at ~16m above waterline; bridge eye placed at ~17m
Views=4
ViewX(1)=0
ViewY(1)=-3.0
ViewZ(1)=-28
ViewX(2)=4.5
ViewY(2)=-3.5
ViewZ(2)=-28
ViewX(3)=-4.5
ViewY(3)=-3.5
ViewZ(3)=-28
ViewX(4)=0
ViewY(4)=30
ViewZ(4)=0
ViewHigh(4)=1

HasGPS=1
HasDepthSounder=1
MaxDepth=200
maxSpeedAhead=15

# Basic physics (Handysize ~25000 DWT)
Mass=25000000
Max_propulsion_force=1250000
DynamicsSpeedA=225000
DynamicsSpeedB=375000
Inertia=50000000000
RudderA=1000000
RudderB=4.0
PropSpace=4.0
Buffet=0.2
Swell=0.1
Windage=0.02

NumberOfLights=5
