# USS Zumwalt (DDG-1000) - guided-missile destroyer, 186m
# Model has length along Y axis, needs -90deg pitch correction
# Real specs: 186m LOA, 24.6m beam, 8.4m draft, 30kn max
# Deckhouse is 60ft+ tall, bridge at top of forward deckhouse
FileName="uss_zumwalt_ddg-1000.glb"
ScaleFactor=7.02
YCorrection=0
AngleCorrection=0
AngleCorrectionPitch=-90
Depth=8

# Ownship camera views (ship-local frame: +Z=fwd, +X=stbd, +Y=up)
# Bridge on Zumwalt is high (deckhouse ~18m), eye ~25m above waterline
